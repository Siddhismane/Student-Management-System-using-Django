{%extends 'masterpage.html'%}
{%block title%}
    details
{%endblock title%}

{%block body%}

<div style="width: fit-content;margin: auto; margin-top: 60px; border: 2px solid black; background-color: darkslategrey;color: white; padding: 10px;">
    <center><h2>Students Details</h2></center>
    <form style="padding: 10px;" method="post">
        {% csrf_token %}
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="n">Full Name</label>
            <input type="text" class="form-control" id="n" placeholder="Enter Full Name" name="name" value="{{student.name}}">
          </div>
          <div class="form-group col-md-6">
            <label for="em">Email</label>
            <input type="email" class="form-control" id="em" placeholder="Email" name="email" value="{{student.email}}">
          </div>

        </div>
        <div class="form-group">
          <label for="c">Address</label>
          <input type="text" class="form-control" id="c" placeholder="enter city" name="city" value="{{student.city}}">
        </div>
        <div class="form-group">
          <label for="d">Degree</label>
          <input type="text" class="form-control" id="d" placeholder="enter your degree here" name="degree" value="{{student.degree}}">
        </div>
        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="p">Percentage</label>
            <input type="text" class="form-control" id="p" name="percentage" value="{{student.percentage}}">
          </div>
          <div class="form-group col-md-4">
            <label for="c">Course</label>
            <select id="c" class="form-control" name="course">
              <option value="python">Python</option>
              <option value="java">Java</option>
              <option value="aws">AWS</option>

            </select>
          </div>
          <div class="form-group col-md-2">
            <label for="f">Fee</label>
            <input type="text" class="form-control" id="f" name="fee" value="{{student.fee}}">
          </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="/myaccount/delete/{{student.reg_no}}/" class="btn btn-danger">Delete</a>

      </form>

</div>
{%endblock body%}
