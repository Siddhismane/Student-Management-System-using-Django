{%extends 'masterpage.html'%}

{%block title %}
Login

{%endblock title %}


{%block body %}


<div
    style="width: 30%;height: 45%; background-color:darkslategrey; padding: 20px; margin: auto; margin-top:100px; color: white;">
    <form method="post">
        {%csrf_token%}
        <h2>Login</h2>
        {%include 'messages.html'%}
        <div class="form-group">
            <label for="u">Username</label>
            <input type="text" class="form-control" id="u" aria-describedby="emailHelp" placeholder="Enter username"
                name="un">
        </div>

        <div class="form-group">
            <label for="p1">Password</label>
            <input type="password" class="form-control" id="p1" placeholder="Password" name="pass1">
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

</div>



{%endblock body %}
