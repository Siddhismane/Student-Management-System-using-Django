{%extends 'masterpage.html'%}

{%block title %}
    sign_up

{%endblock title %}


{%block body %}
    
    
        <div style="width: 30%;height: 45%; background-color:darkslategrey; padding: 20px; margin: auto; margin-top: 30px; color: white;">
            {%include 'messages.html'%}
            <form method="post">               
                {%csrf_token%}
                <h2>SignUp</h2>
                <div class="form-group">
                  <label for="f">First Name</label>
                  <input type="text" class="form-control" id="f" aria-describedby="emailHelp" placeholder="Enter First name" name="fn">
                </div>

                <div class="form-group">
                    <label for="l">Last Name</label>
                    <input type="text" class="form-control" id="l" aria-describedby="emailHelp" placeholder="Enter Last name" name="ln">
                  </div>
                
                  <div class="form-group">
                    <label for="u">Username</label>
                    <input type="text" class="form-control" id="u" aria-describedby="emailHelp" placeholder="Enter username" name="un">
                  </div>
                
                  <div class="form-group">
                    <label for="exampleInputEmail1">Email address</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Enter email" name="email">
                  </div>
                

                <div class="form-group">
                  <label for="p1">Password</label>
                  <input type="password" class="form-control" id="p1" placeholder="Password" name="pass1">
                </div>

                <div class="form-group">
                    <label for="p2">Confirm Password</label>
                    <input type="password" class="form-control" id="p2" placeholder="Password" name="pass2">
                  </div>
                
                <button type="submit" class="btn btn-primary">Submit</button>
              </form>

        </div>
        
    
    
{%endblock body %}
